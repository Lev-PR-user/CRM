name: Run Pytest

on: 
  push: 
    branches: [main]
  pull_request:
    branches: [main]
    workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: | 
          pip install -r requirement.txt

      - name: Run tests with pytest
        run: |
          pytest tests/ -v